[package]
name = "bouncer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "*"
tokio = { version = "1", features = [ "full" ] }
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls-webpki-roots"], default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
log = "0.4.34"
oauth2 = "5.0.0"
chrono = "0.4.45"
chrono-humanize = "0.2.3"
maud = { version = "0.27.0", features = ["axum"] }

[dependencies.ruma]
version = "0.17.0"
default-features = false
features = ["client-api-c"]

[dependencies.ruma-client]
version = "0.20.0"
default-features = false
features = ["client-api", "reqwest-rustls"]
